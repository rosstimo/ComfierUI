name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install supplemental YAML parser
        run: python -m pip install PyYAML
      - name: Validate repository
        run: bash scripts/validate.sh
