services:
  comfyui:
    image: "${COMFYUI_IMAGE_REPOSITORY:-local/comfierui}:${COMFYUI_IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "${COMFYUI_BASE_IMAGE:-ubuntu:24.04}"
        COMFYUI_REPO: "${COMFYUI_REPO:-https://github.com/Comfy-Org/ComfyUI.git}"
        COMFYUI_REF: "${COMFYUI_REF:-v0.28.0}"
        PYTORCH_VERSION: "${PYTORCH_VERSION:-2.11.0}"
        TORCHVISION_VERSION: "${TORCHVISION_VERSION:-0.26.0}"
        TORCHAUDIO_VERSION: "${TORCHAUDIO_VERSION:-2.11.0}"
        TORCH_INDEX_URL: "${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}"
        PUID: "${PUID:-1000}"
        PGID: "${PGID:-1000}"

    init: true
    restart: "${COMFYUI_RESTART_POLICY:-unless-stopped}"
    stop_grace_period: "${COMFYUI_STOP_GRACE_PERIOD:-30s}"
    shm_size: "${COMFYUI_SHM_SIZE:-8gb}"

    ports:
      - "${COMFYUI_BIND_ADDRESS:-127.0.0.1}:${COMFYUI_PORT:-8188}:8188"

    environment:
      TZ: "${TZ:-Etc/UTC}"
      COMFYUI_ACCELERATOR: "${COMFYUI_ACCELERATOR:-cpu}"
      COMFYUI_MANAGER_ENABLED: "${COMFYUI_MANAGER_ENABLED:-true}"
      # The legacy interface currently includes server-side model search and
      # installation. Set false to opt into the newer, more limited interface.
      COMFYUI_MANAGER_LEGACY_UI: "${COMFYUI_MANAGER_LEGACY_UI:-true}"
      COMFYUI_MANAGER_SECURITY_LEVEL: "${COMFYUI_MANAGER_SECURITY_LEVEL:-normal}"
      COMFYUI_MANAGER_NETWORK_MODE: "${COMFYUI_MANAGER_NETWORK_MODE:-personal_cloud}"
      COMFYUI_EXTRA_ARGS: "${COMFYUI_EXTRA_ARGS:-}"
      COMFYUI_UMASK: "${COMFYUI_UMASK:-0002}"

    # Defaults to the container's primary GID. Override this when a shared model
    # library is owned by another group on the host.
    group_add:
      - "${COMFYUI_SHARED_GID:-1000}"

    volumes:
      - type: bind
        source: "${COMFYUI_MODELS_PATH:-./data/models}"
        target: /opt/ComfyUI/models
        bind:
          create_host_path: false
      - type: bind
        source: "${COMFYUI_DATA_PATH:-./data}/custom_nodes"
        target: /opt/ComfyUI/custom_nodes
        bind:
          create_host_path: false
      - type: bind
        source: "${COMFYUI_DATA_PATH:-./data}/user"
        target: /opt/ComfyUI/user
        bind:
          create_host_path: false
      - type: bind
        source: "${COMFYUI_DATA_PATH:-./data}/input"
        target: /opt/ComfyUI/input
        bind:
          create_host_path: false
      - type: bind
        source: "${COMFYUI_DATA_PATH:-./data}/output"
        target: /opt/ComfyUI/output
        bind:
          create_host_path: false
      - type: bind
        source: "${COMFYUI_DATA_PATH:-./data}/temp"
        target: /opt/ComfyUI/temp
        bind:
          create_host_path: false
      - type: bind
        source: "${COMFYUI_DATA_PATH:-./data}/cache"
        target: /data/cache
        bind:
          create_host_path: false
      - type: bind
        source: "${COMFYUI_DATA_PATH:-./data}/home"
        target: /data/home
        bind:
          create_host_path: false
      - type: bind
        source: "${COMFYUI_WORKFLOWS_PATH:-./data/workflows}"
        target: /opt/ComfyUI/user/default/workflows
        bind:
          create_host_path: false
      - type: volume
        source: comfyui-python
        target: /opt/venv

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8188/system_stats
      interval: "${COMFYUI_HEALTH_INTERVAL:-30s}"
      timeout: "${COMFYUI_HEALTH_TIMEOUT:-10s}"
      retries: "${COMFYUI_HEALTH_RETRIES:-5}"
      start_period: "${COMFYUI_HEALTH_START_PERIOD:-90s}"

volumes:
  comfyui-python:
